<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #fff; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; color: #111318; -webkit-font-smoothing: antialiased; }
  a { color: #e92570; text-decoration: none; font-weight: 900; }
  a:hover { color: #111318; }
  @keyframes emo-tick { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
</style>
</helmet>

<div style="width: 390px; height: 844px; margin: 0 auto; box-sizing: border-box; padding: 44px 20px 24px; display: flex; flex-direction: column; align-items: center; background: #fffaf2; background-image: radial-gradient(circle at 50% 6%, rgba(17,19,24,.05), transparent 32%)">

  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="padding: 7px 11px; background: #fff; border: 2px solid #111318; border-radius: 999px; font-weight: 900; font-size: 12px; white-space: nowrap">{{ roundText }}</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 7px 11px; background: #fff; border: 2px solid #111318; border-radius: 999px; font-weight: 900; font-size: 12px; white-space: nowrap">
      <span style="width: 7px; height: 7px; border-radius: 999px; background: #6b6b6b; animation: emo-tick 1s steps(2, start) infinite"></span>대기 중
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
    <div style="width: 116px; height: 116px; border: 4px solid #111318; border-radius: 36px; background: #fff; box-shadow: 0 8px 0 #111318; display: flex; align-items: center; justify-content: center; font-size: 54px">⏰</div>
    <div style="display: flex; flex-direction: column; gap: 8px; align-items: center">
      <div style="font-family: Jua, Pretendard, sans-serif; font-size: 27px; line-height: 1.2">이번 라운드를 놓쳤어요</div>
      <div style="font-size: 15px; line-height: 22px; color: #5b5b5b; max-width: 26ch; text-wrap: pretty">시간 안에 제출하지 못했어요. 다음 라운드는 함께할 수 있어요!</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 18px; border: 3px solid #111318; border-radius: 999px; background: #fff; box-shadow: 0 5px 0 #111318">
      <span style="font-size: 13px; font-weight: 900; color: #6b6b6b; white-space: nowrap">다음 라운드까지</span>
      <span style="font-family: Jua, Pretendard, sans-serif; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums">{{ clock }}</span>
    </div>
  </div>

  <div style="width: 100%; border: 3px solid #111318; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #111318; padding: 12px 14px; display: flex; align-items: center; gap: 11px">
    <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 12px; background: #ffd72f; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none">💡</div>
    <div style="font-size: 14px; line-height: 19px; font-weight: 700; color: #4a4a4a">감정 카드가 뜨면 바로 셔터를 눌러도 괜찮아요</div>
  </div>

  <div style="width: 100%; margin-top: 12px; font-size: 13px; line-height: 18px; color: #6b6b6b; text-align: center; text-wrap: pretty">이번 라운드 결과는 다음 라운드부터 함께 볼 수 있어요</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844}, &quot;round&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;min&quot;: 1, &quot;max&quot;: 7, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;라운드&quot;}, &quot;rounds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 5, &quot;min&quot;: 3, &quot;max&quot;: 7, &quot;step&quot;: 2, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;라운드&quot;}, &quot;waitSeconds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 12, &quot;min&quot;: 5, &quot;max&quot;: 60, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;라운드&quot;}}">
class Component extends DCLogic {
  state = { t: null };

  componentDidMount() {
    this._iv = setInterval(() => {
      this.setState((s) => {
        const t = (s.t ?? this.props.waitSeconds ?? 12) - 1;
        if (t <= 0) {
          clearInterval(this._iv);
          return { t: 0 };
        }
        return { t };
      });
    }, 1000);
  }

  componentWillUnmount() {
    clearInterval(this._iv);
  }

  renderVals() {
    const t = this.state.t ?? this.props.waitSeconds ?? 12;
    return {
      roundText: (this.props.round ?? 3) + " / " + (this.props.rounds ?? 5) + " 라운드",
      clock: "00:" + String(Math.max(0, t)).padStart(2, "0")
    };
  }
}
</script>
</body>
</html>
