<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #fff; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; color: #111318; -webkit-font-smoothing: antialiased; }
  a { color: #e92570; text-decoration: none; font-weight: 900; }
  a:hover { color: #111318; }
  @keyframes emo-wiggle { 0%, 100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
</style>
</helmet>

<div style="width: 390px; height: 844px; margin: 0 auto; box-sizing: border-box; padding: 44px 20px 24px; display: flex; flex-direction: column; background: #fffaf2; background-image: radial-gradient(circle at 50% 4%, rgba(255,215,47,.32), transparent 30%), radial-gradient(circle at 10% 92%, rgba(255,61,134,.14), transparent 30%)">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 34px; height: 34px; border: 2px solid #111318; border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900">‹</div>
      <div style="font-size: 14px; font-weight: 900; color: #6b6b6b">뒤로</div>
    </div>
    <div style="padding: 7px 11px; background: #80efd6; border: 2px solid #111318; border-radius: 999px; font-weight: 900; font-size: 12px; white-space: nowrap">{{ roomSummary }}</div>
  </div>

  <div style="display: flex; justify-content: center; margin-top: 24px">
    <div style="width: 132px; height: 132px; border: 4px solid #111318; border-radius: 40px; background: #ffd72f; box-shadow: 0 8px 0 #111318; display: flex; align-items: center; justify-content: center; font-size: 62px; animation: emo-wiggle 2.4s ease-in-out infinite">📷</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 22px; text-align: center">
    <div style="font-family: Jua, Pretendard, sans-serif; font-size: 27px; line-height: 1.2">이 게임에는<br />카메라가 필요해요</div>
    <div style="font-size: 15px; line-height: 22px; color: #5b5b5b; max-width: 28ch; text-wrap: pretty">지금 찍은 셀카로만 진행되는 게임이에요. 앨범 사진은 쓸 수 없어요.</div>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
    <div style="border: 3px solid #111318; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #111318; padding: 12px 14px; display: flex; align-items: center; gap: 11px">
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 12px; background: #8f66ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none">🤖</div>
      <div style="font-size: 14px; line-height: 19px; font-weight: 700; color: #4a4a4a">촬영된 사진은 감정 판별에만 사용돼요</div>
    </div>
    <div style="border: 3px solid #111318; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #111318; padding: 12px 14px; display: flex; align-items: center; gap: 11px">
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 12px; background: #80efd6; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none">🗑</div>
      <div style="font-size: 14px; line-height: 19px; font-weight: 700; color: #4a4a4a">사진은 라운드가 끝나면 바로 삭제돼요</div>
    </div>
    <div style="border: 3px solid #111318; border-radius: 20px; background: #fff; box-shadow: 0 5px 0 #111318; padding: 12px 14px; display: flex; align-items: center; gap: 11px">
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 12px; background: #ffd72f; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none">👀</div>
      <div style="font-size: 14px; line-height: 19px; font-weight: 700; color: #4a4a4a">제출하기 전까지는 나만 볼 수 있어요</div>
    </div>
  </div>

  <div style="flex: 1; min-height: 10px"></div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="height: 60px; border: 3px solid #111318; border-radius: 18px; background: #ff3d86; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; box-shadow: 0 6px 0 #111318; cursor: pointer; user-select: none">카메라 켜기</div>
    <div style="font-size: 13px; line-height: 18px; color: #6b6b6b; text-align: center; text-wrap: pretty">브라우저가 한 번 권한을 물어봐요. 허용하면 바로 대기실로 들어갑니다.</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844}, &quot;rounds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 5, &quot;min&quot;: 3, &quot;max&quot;: 7, &quot;step&quot;: 2, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;방&quot;}, &quot;seconds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 20, &quot;min&quot;: 15, &quot;max&quot;: 30, &quot;step&quot;: 5, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;방&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      roomSummary: (this.props.rounds ?? 5) + "라운드 · " + (this.props.seconds ?? 20) + "초"
    };
  }
}
</script>
</body>
</html>
