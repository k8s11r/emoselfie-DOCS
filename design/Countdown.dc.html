<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #fff; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; color: #111318; -webkit-font-smoothing: antialiased; }
  a { color: #e92570; text-decoration: none; font-weight: 900; }
  a:hover { color: #111318; }
  @keyframes emo-pop { 0% { transform: scale(.55) rotate(-6deg); opacity: 0 } 55% { transform: scale(1.08) rotate(2deg); opacity: 1 } 100% { transform: scale(1) rotate(0deg); opacity: 1 } }
  @keyframes emo-ring { 0% { transform: scale(.9); opacity: .55 } 100% { transform: scale(1.35); opacity: 0 } }
  @keyframes emo-wiggle { 0%, 100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
  @keyframes emo-exit { 0% { transform: scale(1); opacity: 1 } 100% { transform: scale(1.5); opacity: 0 } }
</style>
</helmet>

<div style="width: 390px; height: 844px; margin: 0 auto; box-sizing: border-box; padding: 44px 20px 24px; display: flex; flex-direction: column; align-items: center; background: #fffaf2; background-image: radial-gradient(circle at 14% 8%, rgba(255,215,47,.35), transparent 30%), radial-gradient(circle at 88% 12%, rgba(143,102,255,.2), transparent 28%), radial-gradient(circle at 50% 96%, rgba(255,61,134,.18), transparent 34%)">

  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="padding: 7px 12px; background: #ffd72f; border: 2px solid #111318; border-radius: 999px; font-weight: 900; font-size: 12px; white-space: nowrap; animation: emo-wiggle 1.6s ease-in-out infinite">곧 시작해요!</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 6px 11px; background: #fff; border: 2px solid #111318; border-radius: 999px; font-weight: 900; font-size: 12px; white-space: nowrap">{{ readyText }}</div>
  </div>

  <div style="margin-top: 26px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center">
    <div style="font-family: Jua, Pretendard, sans-serif; font-size: 30px; line-height: 1.15">{{ headline }}</div>
    <div style="font-size: 16px; line-height: 23px; color: #5b5b5b; max-width: 28ch; text-wrap: pretty">{{ sub }}</div>
  </div>

  <div style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative">
    {{ bigStage }}
  </div>

  <div style="width: 100%; border: 3px solid #111318; border-radius: 24px; background: #fff; box-shadow: 0 6px 0 #111318; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border: 2px solid #111318; border-radius: 14px; background: #80efd6; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none">🤳</div>
    <div style="font-size: 14px; line-height: 20px; font-weight: 700; color: #4a4a4a">얼굴이 화면 안에 다 들어오게, 밝은 쪽을 보고 앉아요</div>
  </div>

  <div style="width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 14px">
    <div style="display: flex">
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 999px; background: #ffd72f; display: flex; align-items: center; justify-content: center; font-size: 18px">😆</div>
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 999px; background: #ff3d86; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-left: -10px">🙂</div>
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 999px; background: #8f66ff; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-left: -10px">😎</div>
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 999px; background: #5ac8ff; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-left: -10px">😲</div>
      <div style="width: 38px; height: 38px; border: 2px solid #111318; border-radius: 999px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; margin-left: -10px">+3</div>
    </div>
    <div style="margin-left: auto; font-size: 13px; font-weight: 900; color: #6b6b6b">{{ roundsText }}</div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 844}, &quot;startFrom&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;min&quot;: 3, &quot;max&quot;: 10, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;카운트다운&quot;}, &quot;rounds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 5, &quot;min&quot;: 3, &quot;max&quot;: 9, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;방&quot;}, &quot;readyCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 7, &quot;min&quot;: 2, &quot;max&quot;: 12, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;방&quot;}}">
class Component extends DCLogic {
  state = { n: null };

  componentDidMount() {
    this.run();
  }

  componentWillUnmount() {
    clearInterval(this._iv);
    clearTimeout(this._to);
  }

  run() {
    clearInterval(this._iv);
    const from = this.props.startFrom ?? 3;
    this.setState({ n: from });
    this._iv = setInterval(() => {
      this.setState((s) => {
        const next = (s.n ?? from) - 1;
        if (next <= -1) {
          clearInterval(this._iv);
          // "시작!"이 잠깐 보였다가 사라진 뒤 라운드 화면으로 넘어감 (데모에선 다시 반복)
          this._to = setTimeout(() => this.run(), 1400);
          return { n: -1 };
        }
        return { n: next };
      });
    }, 1000);
  }

  stage(n) {
    if (n < 0) return null;
    const go = n === 0;
    const face = ["😲", "😆", "🥰", "😐"][Math.max(0, n) % 4];
    const ringColor = go ? "#ff3d86" : ["#8f66ff", "#5ac8ff", "#ffd72f"][Math.max(0, n - 1) % 3];

    const ring = React.createElement("div", {
      key: "ring" + n,
      style: {
        position: "absolute",
        width: 236,
        height: 236,
        borderRadius: 999,
        border: "6px solid " + ringColor,
        animation: "emo-ring 1s ease-out forwards"
      }
    });

    const disc = React.createElement(
      "div",
      {
        key: "disc" + n,
        style: {
          width: 220,
          height: 220,
          borderRadius: 999,
          border: "4px solid #111318",
          background: go ? "#ff3d86" : "#fff",
          color: go ? "#fff" : "#111318",
          boxShadow: "0 10px 0 #111318",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: 2,
          animation: go
            ? "emo-pop .42s cubic-bezier(.2,1.5,.4,1) both, emo-exit .38s ease-in .62s forwards"
            : "emo-pop .42s cubic-bezier(.2,1.5,.4,1) both"
        }
      },
      React.createElement("div", { style: { fontSize: 42, lineHeight: 1 } }, face),
      React.createElement(
        "div",
        { style: { fontFamily: "Jua, Pretendard, sans-serif", fontSize: go ? 56 : 92, lineHeight: 1 } },
        go ? "시작!" : String(n)
      )
    );

    return React.createElement(
      "div",
      { style: { position: "relative", display: "flex", alignItems: "center", justifyContent: "center" } },
      ring,
      disc
    );
  }

  renderVals() {
    const n = this.state.n ?? (this.props.startFrom ?? 3);
    const go = n <= 0;
    const gone = n < 0;
    const rounds = this.props.rounds ?? 5;
    return {
      bigStage: this.stage(n),
      headline: gone ? "라운드 1" : go ? "첫 감정 카드 열립니다" : "카메라 준비하세요",
      sub: gone
        ? "감정 카드를 여는 중…"
        : go
        ? "20초 안에 그 표정을 지어 셀카를 찍으면 끝!"
        : "화면에 감정이 뜨면 그 표정으로 셀카 한 장",
      readyText: (this.props.readyCount ?? 7) + "명 준비 완료",
      roundsText: rounds + "라운드 · 라운드당 20초"
    };
  }
}
</script>
</body>
</html>
